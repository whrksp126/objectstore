# /srv/nginx-proxy/conf.d/objectstore.conf
# Cloudflare(DNS only, 직통) → 공유기 → nginx_proxy(80/443) → objectstore_minio_prod
# - API 도메인: S3 SDK / aws-cli endpoint
# - Console 도메인: 사람이 쓰는 Web UI (websocket 업그레이드 필요)
# 인증서/프록시 헤더/realip/limit zone 은 nginx_proxy 공용 자산(snippets/, 00-ghmate-common.conf) 사용.
# 공용 헤더 snippet 이 Host 를 $host 로 넘기므로 S3 SigV4 서명 검증과 호환된다.

# ───────── HTTP → HTTPS ─────────
server {
    listen 80;
    server_name objectstore.ghmate.com objectstore-console.ghmate.com;
    return 301 https://$host$request_uri;
}

# ───────── API (S3 endpoint) ─────────
server {
    listen 443 ssl;
    server_name objectstore.ghmate.com;
    include /etc/nginx/conf.d/snippets/ghmate-ssl.inc;

    # MinIO 권장: 큰 파일 PUT 대비 업로드 제한 해제, 버퍼링 끄기
    # (직통이라 Cloudflare 100MB 제한 없음. 단일 PUT 상한은 이 값)
    client_max_body_size 5G;
    ignore_invalid_headers off;
    proxy_buffering off;
    proxy_request_buffering off;

    # S3 API 전체가 업로드/멀티파트 경로 → limit_req 는 걸지 않고 동시 연결만 넉넉히 제한.
    # (멀티파트 병렬 part 업로드 + presigned GET 다발을 막지 않기 위함)
    limit_conn ghmate_conn 200;

    # Docker 내장 DNS. 변수 proxy_pass 와 함께 써야 요청마다 컨테이너 IP 를 재확인한다.
    # (문자열 직접 proxy_pass 는 reload 시점 IP 캐시 → 재배포 502 / 컨테이너 죽으면 nginx -t 실패로 전 프로젝트 reload 차단)
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $up_api objectstore_minio_prod;
        proxy_pass http://$up_api:9000;
        include /etc/nginx/conf.d/snippets/ghmate-proxy-headers.inc;
        proxy_connect_timeout 300;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        chunked_transfer_encoding off;
    }
}

# ───────── Console (Web UI) ─────────
server {
    listen 443 ssl;
    server_name objectstore-console.ghmate.com;
    include /etc/nginx/conf.d/snippets/ghmate-ssl.inc;

    client_max_body_size 5G;
    proxy_buffering off;
    proxy_request_buffering off;

    limit_req zone=ghmate_req burst=200 nodelay;
    limit_conn ghmate_conn 100;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $up_console objectstore_minio_prod;
        proxy_pass http://$up_console:9001;
        include /etc/nginx/conf.d/snippets/ghmate-proxy-headers.inc;
        proxy_connect_timeout 300;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        chunked_transfer_encoding off;
    }
}
